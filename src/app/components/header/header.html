<div class="top-banner">
  <p class="announce">
    <span class="sr-only">Are you a freight forwarder? Or shipper?</span>
    <span class="marquee" aria-hidden="true">
      <span class="marquee__inner" data-text="Are you a freight forwarder? Or shipper?  • ">
        <span>Are you a freight forwarder? Or shipper?</span>
      </span>
    </span>
  </p>
  <button class="join-btn" aria-label="Join our marketplace">
    <span class="join-btn__content">
      <span class="join-btn__label">Join our marketplace</span>
     <img src="/images/icons/login.svg" alt="" aria-hidden="true" class="btn-icon">
    </span>
    <span class="sr-only">Join our marketplace</span>
  </button>
  <!-- <button class="join-btn">Join our marketplace →</button> -->
</div>

<header class="header">
  <div class="container">
    <div class="header-content">
      <!-- Logo -->
      <div class="logo">
        <img src="/images/logo.png" alt="Booking Container" >
      </div>

      <!-- Hamburger Menu Button (Mobile Only) -->
      <button class="mobile-menu-toggle" 
              (click)="toggleMobileMenu()"
              [class.active]="isMobileMenuOpen"
              aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Mobile Menu Overlay -->
      <div class="mobile-overlay" 
           [class.active]="isMobileMenuOpen"
           (click)="closeMobileMenu()"></div>

      <!-- Navigation -->
      <nav class="nav" [class.mobile-open]="isMobileMenuOpen">
        <a *ngFor="let item of navItems" 
           [href]="item.link" 
           [class.active]="item.active"
           [class.external]="item.external"
           (click)="closeMobileMenu()">
          {{ item.label }}
          <span *ngIf="item.external" class="external-icon">↗</span>
        </a>
      </nav>

      <!-- Action Buttons -->
      <div class="actions">
        <button class="btn-quote">Request a quote <img src="/images/icons/request.svg" alt="" aria-hidden="true" class="btn-icon"></button>
        <button class="btn-signup">Sign up for Free <img src="/images/icons/sign%20up.svg" alt="" aria-hidden="true" class="btn-icon"></button>
        <button class="btn-login">Login<img src="/images/icons/login.svg" alt="" aria-hidden="true" class="btn-icon"></button>
      </div>
    </div>
  </div>
</header>
