<div class="search-form-container">
  <!-- Transport Type Tabs -->
  <div class="transport-tabs">
    <button 
      *ngFor="let type of transportTypes" 
      class="transport-tab"
      [class.active]="selectedTransport === type.value"
      (click)="selectTransport(type.value)">
      <img class="tab-icon" [src]="'/images/icons/' + type.value + '.svg'" [alt]="type.label + ' icon'" />
      <span class="tab-label">{{ type.label }}</span>
    </button>
    
    <button class="schedules-btn" (click)="toggleSchedules()">
      <img class="schedules-icon" src="/images/icons/shedules.svg" alt="Schedules icon" />
      <span>Schedules</span>
    </button>
  </div>

  <!-- Search Form -->
  <form class="search-form" (ngSubmit)="onSearch()">
    <!-- Main Form Grid -->
    <div class="form-grid">
      <!-- First Row: From and To -->
      <div class="form-group from-group">
        <label for="from">From</label>
        <div class="input-wrapper">
          <img class="input-icon" src="/images/icons/maps.svg" alt="Map icon" />
          <input 
            type="text" 
            id="from"
            [(ngModel)]="searchForm.from"
            name="from"
            placeholder="e.g. Casablanca port, MA"
            class="form-control">
        </div>
      </div>

      <div class="form-group to-group">
        <label for="to">To</label>
        <div class="input-wrapper">
          <img class="input-icon" src="/images/icons/maps.svg" alt="Map icon" />
          <input 
            type="text" 
            id="to"
            [(ngModel)]="searchForm.to"
            name="to"
            placeholder="e.g. Mallorca, SPA"
            class="form-control">
        </div>
      </div>

      <!-- Third Column: Date Selection -->
      <div class="form-group date-group">
        <label>Specific day</label>
        <div class="date-toggle">
          <label class="toggle-option" [class.active]="!searchForm.isInterval" (click)="searchForm.isInterval = false">
            <input 
              type="radio" 
              name="dateType" 
              [checked]="!searchForm.isInterval"
              (change)="searchForm.isInterval = false">
            <span>Specific day</span>
          </label>
          <label class="toggle-option" [class.active]="searchForm.isInterval" (click)="searchForm.isInterval = true">
            <input 
              type="radio" 
              name="dateType" 
              [checked]="searchForm.isInterval"
              (change)="searchForm.isInterval = true">
            <span>Interval</span>
          </label>
        </div>
        <div class="input-wrapper">
          <img class="input-icon" src="/images/icons/date.svg" alt="Date icon" />
          <input 
            type="text" 
            id="date"
            [(ngModel)]="searchForm.date"
            name="date"
            placeholder="Select a date"
            class="form-control"
            onfocus="(this.type='date')"
            onblur="(this.type='text')">
        </div>
      </div>

      <!-- Second Row: Shipping type and Transport unit type -->
      <div class="form-group">
        <label for="shippingType">Shipping type</label>
        <div class="input-wrapper">
          <select 
            id="shippingType"
            [(ngModel)]="searchForm.shippingType"
            name="shippingType"
            class="form-control">
            <option value="" disabled selected>e.g. Full container load (FCL)</option>
            <option *ngFor="let type of shippingTypes" [value]="type">{{ type }}</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="transportUnit">
          Transport unit type
          <span class="info-icon" title="Information about transport unit types">ℹ️</span>
        </label>
        <div class="input-wrapper">
          <select 
            id="transportUnit"
            [(ngModel)]="searchForm.transportUnit"
            name="transportUnit"
            class="form-control">
            <option value="" disabled selected>e.g. 20' Standard</option>
            <option *ngFor="let unit of transportUnits" [value]="unit">{{ unit }}</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Sort Options and Search Button -->
    <div class="actions-row">
      <div class="sort-options">
        <label *ngFor="let option of sortOptions" class="sort-option">
          <input 
            type="checkbox" 
            [value]="option.value"
            [(ngModel)]="option.checked"
            [name]="'sort-' + option.value">
          <span>{{ option.label }}</span>
        </label>
      </div>

      <button type="submit" class="search-btn">
        <span>Show {{ resultsCount | number }} results</span>
        <img class="search-icon" src="/images/icons/search.svg" alt="Search icon" />
      </button>
    </div>

  
  </form>
</div>
