<div class="top-banner">
  <p>Are you a freight forwarder? Or shipper?</p>
  <button class="join-btn">Join our marketplace →</button>
</div>

<header class="header">
  <div class="container">
    <div class="header-content">
      <!-- Logo -->
      <div class="logo">
        <img src="/images/logo.png" alt="Booking Container" >
      </div>

      <!-- Hamburger Menu Button (Mobile Only) -->
      <button class="mobile-menu-toggle" 
              (click)="toggleMobileMenu()"
              [class.active]="isMobileMenuOpen"
              aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Mobile Menu Overlay -->
      <div class="mobile-overlay" 
           [class.active]="isMobileMenuOpen"
           (click)="closeMobileMenu()"></div>

      <!-- Navigation -->
      <nav class="nav" [class.mobile-open]="isMobileMenuOpen">
        <a *ngFor="let item of navItems" 
           [href]="item.link" 
           [class.active]="item.active"
           [class.external]="item.external"
           (click)="closeMobileMenu()">
          {{ item.label }}
          <span *ngIf="item.external" class="external-icon">↗</span>
        </a>
      </nav>

      <!-- Action Buttons -->
      <div class="actions">
        <button class="btn-quote"><img src="/images/icons/request.svg" alt="" aria-hidden="true" class="btn-icon">Request a quote</button>
        <button class="btn-signup"><img src="/images/icons/sign%20up.svg" alt="" aria-hidden="true" class="btn-icon">Sign up for Free</button>
        <button class="btn-login"><img src="/images/icons/login.svg" alt="" aria-hidden="true" class="btn-icon">Login</button>
      </div>
    </div>
  </div>
</header>
